<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧识桥 api · 统计门户</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #F7F7F5; --card: #FFFFFF; --ink: #1F2328; --text: #4B5563; --muted: #6B7280;
    --line: #E5E7EB; --hover: #F3F4F6; --primary: #334155; --primary-hover: #1F2937; --primary-bg: #E8EBEF;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif; font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono","SFMono-Regular",Consolas,monospace; }

  .topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .topbar .sub { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .topbar a { color: var(--primary); text-decoration: none; font-size: 13px; }
  .topbar a:hover { color: var(--primary-hover); }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; text-align: center; }
  .stat-card .num { font-size: 26px; font-weight: 600; color: var(--primary); line-height: 1; margin-bottom: 6px; }
  .stat-card .label { font-size: 13px; color: var(--muted); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .section-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .section-head .hint { color: var(--muted); font-size: 12px; }

  .api-list { display: flex; flex-direction: column; gap: 10px; }
  .api-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .api-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .api-name { font-weight: 500; font-size: 14px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; line-height: 18px; color: var(--muted); background: var(--hover); }
  .tag.on { color: var(--primary); background: var(--primary-bg); }
  .api-head .path { font-size: 12px; color: var(--muted); }

  .url-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .url-text { flex: 1 1 240px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 12px; word-break: break-all; }
  .btn { border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; background: var(--card); color: var(--text); white-space: nowrap; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  .btn:hover { background: var(--hover); color: var(--ink); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.plain { background: var(--card); border-color: var(--line); color: var(--text); }
  .btn.plain:hover { background: var(--hover); }
  a.btn { text-decoration: none; display: inline-block; }

  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: rgba(31,35,40,.92); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .15s ease; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }

  .empty, .loading, .error { text-align: center; color: var(--muted); padding: 40px 0; font-size: 13px; }
  .error { color: #B91C1C; }

  @media (max-width: 768px) {
    .wrap { padding: 12px; }
    .overview { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 12px 14px; }
  }
  @media (max-width: 480px) {
    .topbar h1 { font-size: 16px; }
    .topbar .sub { display: block; margin-left: 0; margin-top: 2px; }
    .stat-card { padding: 14px; }
    .url-text { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>旧识桥 api</h1>
    <span class="sub">统计门户</span>
  </div>
  <div><a href="admin/">管理后台</a></div>
</div>

<div class="wrap">
  <div id="overview" class="overview">
    <div class="stat-card"><div class="num">-</div><div class="label">接口</div></div>
    <div class="stat-card"><div class="num">-</div><div class="label">素材</div></div>
    <div class="stat-card"><div class="num">-</div><div class="label">调用总数</div></div>
    <div class="stat-card"><div class="num">-</div><div class="label">今日</div></div>
  </div>

  <div id="statsStatus" class="loading">加载中…</div>

  <div id="apiSection" style="display:none">
    <div class="section-head">
      <h2>接口列表</h2>
      <span class="hint" id="apiHint"></span>
    </div>
    <div class="api-list" id="apiList"></div>
    <div style="margin-top:12px">
      <button class="btn" id="copyAllBtn" type="button">复制全部地址</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  window.APP_CONFIG = window.APP_CONFIG || {};
  const API_BASE = window.APP_CONFIG.API_BASE || new URL('api/index.php', document.baseURI).href;
  const overviewEl = document.getElementById('overview');
  const statsStatusEl = document.getElementById('statsStatus');
  const apiSectionEl = document.getElementById('apiSection');
  const apiListEl = document.getElementById('apiList');
  const apiHintEl = document.getElementById('apiHint');
  const copyAllBtn = document.getElementById('copyAllBtn');
  const toastEl = document.getElementById('toast');
  let allApis = [];

  function fmtNum(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  function renderOverview(data) {
    overviewEl.innerHTML = '';
    const items = [
      { key: 'api_total', label: '接口' },
      { key: 'text_total', label: '素材' },
      { key: 'call_total', label: '调用总数' },
      { key: 'call_today', label: '今日' },
    ];
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = fmtNum(data[item.key] || 0);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = item.label;
      card.appendChild(num);
      card.appendChild(label);
      overviewEl.appendChild(card);
    });
  }

  function callUrl(path) {
    return API_BASE + '?route=runtime&path=' + encodeURIComponent(path);
  }

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return copyTextFallback(text); });
    }
    return copyTextFallback(text);
  }

  function copyTextFallback(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let copied = false;
    try {
      copied = document.execCommand('copy') === true;
    } finally {
      document.body.removeChild(ta);
    }
    return copied ? Promise.resolve() : Promise.reject(new Error('copy failed'));
  }

  function renderApis(apis) {
    allApis = apis || [];
    apiListEl.innerHTML = '';
    apiSectionEl.style.display = 'block';

    if (!allApis.length) {
      apiHintEl.textContent = '暂无启用接口';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '后台还没有启用任何接口';
      apiListEl.appendChild(empty);
      copyAllBtn.style.display = 'none';
      return;
    }

    apiHintEl.textContent = allApis.length + ' 个接口 · 无需密钥';
    copyAllBtn.style.display = '';

    allApis.forEach(api => {
      const url = callUrl(api.path);
      const item = document.createElement('div');
      item.className = 'api-item';

      const head = document.createElement('div');
      head.className = 'api-head';
      const name = document.createElement('span');
      name.className = 'api-name';
      name.textContent = api.name || api.path;
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = api.type === 'template' ? '模板' : '随机';
      const path = document.createElement('span');
      path.className = 'mono path';
      path.textContent = api.path;
      head.appendChild(name);
      head.appendChild(tag);
      head.appendChild(path);

      const row = document.createElement('div');
      row.className = 'url-row';
      const urlText = document.createElement('div');
      urlText.className = 'mono url-text';
      urlText.textContent = url;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn';
      copyBtn.type = 'button';
      copyBtn.textContent = '复制';
      copyBtn.addEventListener('click', () => {
        copyText(url).then(() => toast('已复制 ' + api.path)).catch(() => toast('复制失败'));
      });
      const openLink = document.createElement('a');
      openLink.className = 'btn plain';
      openLink.href = url;
      openLink.target = '_blank';
      openLink.rel = 'noopener';
      openLink.textContent = '打开';
      row.appendChild(urlText);
      row.appendChild(copyBtn);
      row.appendChild(openLink);

      item.appendChild(head);
      item.appendChild(row);
      apiListEl.appendChild(item);
    });
  }

  function setStatus(message, isError) {
    statsStatusEl.className = isError ? 'error' : 'empty';
    statsStatusEl.textContent = message;
  }

  function loadStats() {
    fetch(API_BASE + '?route=stats', { credentials: 'omit' })
      .then(r => r.json())
      .then(res => {
        if (res && res.code === 0 && res.data) {
          renderOverview(res.data.overview || {});
          renderApis(res.data.apis || []);
          setStatus('', false);
          statsStatusEl.style.display = 'none';
        } else {
          setStatus('加载失败', true);
        }
      })
      .catch(() => setStatus('请求失败', true));
  }

  copyAllBtn.addEventListener('click', () => {
    if (!allApis.length) return;
    const text = allApis.map(api => (api.name || api.path) + '\t' + callUrl(api.path)).join('\n');
    copyText(text).then(() => toast('已复制全部地址')).catch(() => toast('复制失败'));
  });

  loadStats();
})();
</script>
</body>
</html>
