<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧识桥 api · 访问日志</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css">
<link rel="stylesheet" href="css/theme.css">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
<script src="js/app.js"></script>
<style>
  .pager { display: flex; justify-content: flex-end; margin-top: 14px; }
  .log-card { background: #fff; border: 1px solid var(--el-border-color); border-radius: 8px; padding: 14px; }
  .log-card + .log-card { margin-top: 10px; }
  .log-card .h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
  .log-card .h .k { color: var(--el-text-color-secondary); }
  .log-card .params { max-height: 90px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1>访问日志</h1>
      <span class="sub">{{ apiId ? 'API #' + apiId : '全部调用' }}</span>
    </div>
    <div class="actions">
      <el-button size="small" @click="goBack">返回列表</el-button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="toolbar">
        <el-input v-model="query.ip" placeholder="按 IP 筛选" clearable style="width:180px" @keyup.enter="onSearch" @clear="onSearch" :prefix-icon="'Search'"></el-input>
        <el-date-picker v-model="timeRange" type="datetimerange" range-separator="至"
          start-placeholder="开始时间" end-placeholder="结束时间" value-format="YYYY-MM-DD HH:mm:ss"
          style="width:360px" @change="onSearch"></el-date-picker>
        <el-button type="primary" @click="onSearch">搜索</el-button>
        <el-button @click="reload">刷新</el-button>
        <span class="grow"></span>
        <el-button class="danger-text" plain @click="onClear">清空</el-button>
      </div>

      <el-table :data="list" v-loading="tableLoading" v-show="!isMobile">
        <el-table-column label="ID" prop="id" width="70" align="center"></el-table-column>
        <el-table-column label="API" prop="api_id" width="80" align="center"></el-table-column>
        <el-table-column label="IP" width="170">
          <template #default="{ row }"><span class="mono">{{ row.ip || '-' }}</span></template>
        </el-table-column>
        <el-table-column label="调用时间" width="170">
          <template #default="{ row }">{{ JSQ.fmtTime(row.call_time) }}</template>
        </el-table-column>
        <el-table-column label="参数" min-width="260">
          <template #default="{ row }"><div class="params">{{ row.params }}</div></template>
        </el-table-column>
      </el-table>

      <!-- 移动端卡片 -->
      <div v-show="isMobile">
        <div class="log-card" v-for="row in list" :key="row.id">
          <div class="h">
            <span class="k">#{{ row.id }}</span>
            <span class="k">API #{{ row.api_id }}</span>
            <span class="mono">{{ row.ip }}</span>
          </div>
          <div class="h"><span class="k">时间</span><span>{{ JSQ.fmtTime(row.call_time) }}</span></div>
          <div class="params">{{ row.params }}</div>
        </div>
      </div>

      <div class="pager" v-show="!isMobile">
        <el-pagination background layout="total, prev, pager, next"
          :total="total" :page-size="query.page_size" :current-page="query.page"
          @current-change="onPageChange"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, onBeforeUnmount } = Vue;

const app = createApp({
  setup() {
    const JSQ = window.JSQ;
    const apiId = ref(0);
    const list = ref([]);
    const total = ref(0);
    const tableLoading = ref(false);
    const timeRange = ref([]);
    const query = reactive({ ip: '', page: 1, page_size: 20 });

    const isMobile = ref(false);
    function checkMobile() { isMobile.value = window.innerWidth <= 768; }
    onMounted(() => { checkMobile(); window.addEventListener('resize', checkMobile); });
    onBeforeUnmount(() => window.removeEventListener('resize', checkMobile));

    function goBack() { location.href = 'index.html'; }

    function parseDateTimeLocal(value) {
      if (typeof value !== 'string') return null;
      const m = value.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
      if (!m) return null;
      const date = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5]), Number(m[6]));
      if (date.getFullYear() !== Number(m[1]) || date.getMonth() !== Number(m[2]) - 1 ||
          date.getDate() !== Number(m[3]) || date.getHours() !== Number(m[4]) ||
          date.getMinutes() !== Number(m[5]) || date.getSeconds() !== Number(m[6])) {
        return null;
      }
      return date;
    }

    function buildParams() {
      const params = { page: query.page, page_size: query.page_size };
      if (apiId.value) params.api_id = apiId.value;
      if (query.ip) params.ip = query.ip;
      if (Array.isArray(timeRange.value) && timeRange.value.length === 2) {
        const s = parseDateTimeLocal(timeRange.value[0]);
        const e = parseDateTimeLocal(timeRange.value[1]);
        if (s && !isNaN(s.getTime())) params.start_time = Math.floor(s.getTime() / 1000);
        if (e && !isNaN(e.getTime())) params.end_time = Math.floor(e.getTime() / 1000);
      }
      return params;
    }

    async function loadList() {
      tableLoading.value = true;
      try {
        const data = await JSQ.listLog(buildParams());
        list.value = data.list || [];
        total.value = data.total || 0;
      } catch (e) {
      } finally {
        tableLoading.value = false;
      }
    }

    function onSearch() { query.page = 1; loadList(); }
    function onPageChange(p) { query.page = p; loadList(); }
    function reload() { loadList(); }

    async function onClear() {
      const msg = apiId.value
        ? '确定清空 API #' + apiId.value + ' 的所有日志？'
        : '确定清空全部访问日志？';
      try {
        await ElMessageBox.confirm(msg, '清空确认', {
          type: 'warning', confirmButtonText: '清空', cancelButtonText: '取消',
        });
      } catch (e) { return; }
      try {
        const payload = {};
        if (apiId.value) payload.api_id = apiId.value;
        const res = await JSQ.clearLog(payload);
        ElMessage.success('已清空 ' + (res && res.deleted != null ? res.deleted : 0) + ' 条');
        query.page = 1;
        loadList();
      } catch (e) {}
    }

    onMounted(async () => {
      const ok = await JSQ.ensureLogin();
      if (!ok) return;
      const q = new URLSearchParams(location.search);
      apiId.value = parseInt(q.get('api_id') || '0', 10) || 0;
      loadList();
    });

    return { JSQ, apiId, list, total, tableLoading, timeRange, query, goBack, onSearch, onPageChange, reload, onClear, isMobile };
  },
}).use(ElementPlus);

if (window.ElementPlusIconsVue) {
  for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
    app.component(name, comp);
  }
}

app.mount('#app');
</script>
</body>
</html>
