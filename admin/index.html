<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧识桥 api · 管理后台</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css">
<link rel="stylesheet" href="css/theme.css">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
<script src="js/app.js"></script>
<style>
  /* API 列表页特有样式 */
  .table-card { background: #fff; border: 1px solid var(--el-border-color); border-radius: 8px; padding: 8px; overflow-x: auto; }
  .pager { display: flex; justify-content: flex-end; margin-top: 14px; }
  .op-group { display: inline-flex; gap: 4px; white-space: nowrap; }
  .op-divider { display: inline-block; width: 1px; height: 14px; background: var(--el-border-color); margin: 0 4px; vertical-align: middle; }

  /* 移动端卡片 */
  .card-list { display: flex; flex-direction: column; gap: 12px; }
  .api-card { background: #fff; border: 1px solid var(--el-border-color); border-radius: 8px; padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .card-head .path { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 500; }
  .card-body { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 13px; }
  .card-body .row { display: flex; gap: 8px; }
  .card-body .row .k { color: var(--el-text-color-secondary); min-width: 56px; }
  .card-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card-actions .el-button { width: 100%; margin: 0; }

  @media (max-width: 480px) {
    .table-card { padding: 4px; }
    .el-pagination { --el-pagination-button-size: 28px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1>旧识桥 api</h1>
      <span class="sub">接口配置</span>
    </div>
    <div class="actions">
      <span class="sub" v-if="username">{{ username }}</span>
      <el-button size="small" @click="onChangePassword">修改密码</el-button>
      <el-button size="small" @click="onLogout">退出登录</el-button>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <el-button type="primary" :icon="'Plus'" @click="goAdd">新增接口</el-button>
      <el-input class="grow" style="max-width:240px" v-model="query.keyword" placeholder="搜索 path / 名称" clearable @input="onKeywordInput" :prefix-icon="'Search'"></el-input>
      <el-select v-model="query.enabled" placeholder="状态" clearable style="width:120px" @change="onSearch">
        <el-option label="启用" :value="1"></el-option>
        <el-option label="禁用" :value="0"></el-option>
      </el-select>
      <el-button :icon="'Refresh'" @click="loadList">刷新</el-button>
    </div>

    <div class="table-card" v-show="!isMobile">
      <el-table :data="list" v-loading="loading">
        <el-table-column prop="id" label="ID" width="60" align="center"></el-table-column>
        <el-table-column prop="path" label="Path" width="160">
          <template #default="s"><span class="mono">{{ s.row.path }}</span></template>
        </el-table-column>
        <el-table-column prop="name" label="名称" min-width="120"></el-table-column>
        <el-table-column label="类型" width="110">
          <template #default="s">
            <el-tag type="info">{{ s.row.type === 'template' ? '模板' : '随机' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="80">
          <template #default="s">
            <el-tag :type="s.row.enabled === 1 ? 'primary' : 'info'">{{ s.row.enabled === 1 ? '启用' : '禁用' }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="创建时间" width="160">
          <template #default="s">{{ JSQ.fmtTime(s.row.create_time) }}</template>
        </el-table-column>
        <el-table-column label="操作" min-width="320" align="right">
          <template #default="s">
            <span class="op-group">
              <el-button size="small" text @click="goEdit(s.row.id)">编辑</el-button>
              <el-button size="small" text @click="goText(s.row.id)">素材</el-button>
              <el-button size="small" text @click="goLog(s.row.id)">日志</el-button>
              <span class="op-divider"></span>
              <el-button size="small" text @click="toggleRow(s.row)">{{ s.row.enabled === 1 ? '禁用' : '启用' }}</el-button>
              <el-button size="small" text @click="copyUrl(s.row)">复制地址</el-button>
              <el-button size="small" text class="danger-text" @click="delRow(s.row)">删除</el-button>
            </span>
          </template>
        </el-table-column>
      </el-table>
      <div class="pager">
        <el-pagination background layout="total, prev, pager, next"
          :total="total" :page-size="query.page_size" :current-page="query.page"
          @current-change="onPageChange"></el-pagination>
      </div>
    </div>

    <!-- 移动端卡片 -->
    <div class="card-list" v-show="isMobile">
      <div class="api-card" v-for="row in list" :key="row.id">
        <div class="card-head">
          <span class="path">{{ row.path }}</span>
          <el-tag type="info" size="small">{{ row.type === 'template' ? '模板' : '随机' }}</el-tag>
          <el-tag :type="row.enabled === 1 ? 'primary' : 'info'" size="small">{{ row.enabled === 1 ? '启用' : '禁用' }}</el-tag>
        </div>
        <div class="card-body">
          <div class="row"><span class="k">名称</span><span>{{ row.name }}</span></div>
          <div class="row"><span class="k">创建</span><span>{{ JSQ.fmtTime(row.create_time) }}</span></div>
        </div>
        <div class="card-actions">
          <el-button size="small" @click="goEdit(row.id)">编辑</el-button>
          <el-button size="small" @click="goText(row.id)">素材</el-button>
          <el-button size="small" @click="goLog(row.id)">日志</el-button>
          <el-button size="small" @click="toggleRow(row)">{{ row.enabled === 1 ? '禁用' : '启用' }}</el-button>
          <el-button size="small" type="primary" plain @click="copyUrl(row)">复制地址</el-button>
          <el-button size="small" class="danger-text" plain @click="delRow(row)">删除</el-button>
        </div>
      </div>
      <div class="pager">
        <el-pagination background layout="prev, pager, next"
          :total="total" :page-size="query.page_size" :current-page="query.page"
          @current-change="onPageChange"></el-pagination>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, onBeforeUnmount } = Vue;

const app = createApp({
  setup() {
    const JSQ = window.JSQ;
    const list = ref([]);
    const total = ref(0);
    const loading = ref(false);
    const username = ref('');
    const query = reactive({ keyword: '', enabled: null, page: 1, page_size: 20 });

    const isMobile = ref(false);
    function checkMobile() { isMobile.value = window.innerWidth <= 768; }
    onMounted(() => { checkMobile(); window.addEventListener('resize', checkMobile); });
    let searchTimer = null;
    function onKeywordInput() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(onSearch, 300);
    }
    onBeforeUnmount(() => {
      clearTimeout(searchTimer);
      window.removeEventListener('resize', checkMobile);
    });

    async function loadList() {
      loading.value = true;
      try {
        const params = { page: query.page, page_size: query.page_size };
        if (query.keyword) params.keyword = query.keyword;
        if (query.enabled !== null && query.enabled !== '') params.enabled = query.enabled;
        const data = await JSQ.apiRequest('admin/api/list', params, 'GET');
        list.value = data.list || [];
        total.value = data.total || 0;
      } catch (e) {
      } finally {
        loading.value = false;
      }
    }

    function onSearch() { query.page = 1; loadList(); }
    function onPageChange(p) { query.page = p; loadList(); }

    function goAdd() { location.href = 'edit-api.html'; }
    function goEdit(id) { location.href = 'edit-api.html?id=' + id; }
    function goText(id) { location.href = 'text-manage.html?api_id=' + id; }
    function goLog(id) { location.href = 'log.html?api_id=' + id; }

    async function toggleRow(row) {
      const target = row.enabled === 1 ? 0 : 1;
      if (target === 0) {
        try {
          await ElMessageBox.confirm('确认禁用「' + row.path + '」？对外调用将返回 403。', '禁用确认', {
            type: 'warning', confirmButtonText: '禁用', cancelButtonText: '取消',
          });
        } catch (e) { return; }
      }
      try {
        await JSQ.toggleApi(row.id, target);
        row.enabled = target;
        ElMessage.success(target === 1 ? '已启用' : '已禁用');
      } catch (e) {}
    }

    async function delRow(row) {
      try {
        await ElMessageBox.confirm('确认删除「' + row.path + '」？其素材将一并删除。', '删除确认', {
          type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消',
        });
      } catch (e) { return; }
      try {
        await JSQ.deleteApi(row.id);
        ElMessage.success('已删除');
        loadList();
      } catch (e) {}
    }

    async function copyUrl(row) {
      const url = JSQ.buildApiUrl(row.path);
      try {
        await JSQ.copyText(url);
        ElMessage.success('已复制');
      } catch (e) {
        ElMessage.error('复制失败');
      }
    }

    async function onChangePassword() {
      let oldPassword = '';
      try {
        const r1 = await ElMessageBox.prompt('请输入当前密码', '修改密码', {
          confirmButtonText: '下一步', cancelButtonText: '取消', inputType: 'password',
        });
        oldPassword = r1.value;
      } catch (e) { return; }
      let newPassword = '';
      try {
        const r2 = await ElMessageBox.prompt('请输入新密码（8-128 位）', '修改密码', {
          confirmButtonText: '保存', cancelButtonText: '取消', inputType: 'password',
          inputPattern: /^[\s\S]{8,128}$/,
          inputErrorMessage: '新密码长度需 8-128 位',
        });
        newPassword = r2.value;
      } catch (e) { return; }
      try {
        await JSQ.changePassword(oldPassword, newPassword);
        ElMessage.success('密码已修改，其它设备需重新登录');
      } catch (e) {}
    }

    async function onLogout() {
      try {
        await ElMessageBox.confirm('确认退出登录？', '退出确认', {
          type: 'warning', confirmButtonText: '退出', cancelButtonText: '取消',
        });
      } catch (e) { return; }
      JSQ.logout();
    }

    onMounted(async () => {
      const ok = await JSQ.ensureLogin();
      if (!ok) return;
      username.value = JSQ.getUsername();
      loadList();
    });

    return { JSQ, list, total, loading, query, username, loadList, onSearch, onKeywordInput, onPageChange, goAdd, goEdit, goText, goLog, toggleRow, delRow, copyUrl, onChangePassword, onLogout, isMobile };
  },
}).use(ElementPlus);

if (window.ElementPlusIconsVue) {
  for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
    app.component(name, comp);
  }
}

app.mount('#app');
</script>
</body>
</html>
