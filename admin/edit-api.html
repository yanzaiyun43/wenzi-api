<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧识桥 api · 新增 / 编辑 API</title>
<!-- CDN 锁版本：Vue3 / Element Plus / icons / axios -->
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
<script src="js/app.js"></script>
<style>
  body { margin: 0; background: #f5f6fa; font-family: -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  .topbar { background: #fff; border-bottom: 1px solid #e4e7ed; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .topbar h1 { margin: 0; font-size: 16px; color: #303133; }
  .topbar .sub { color: #909399; font-size: 11px; margin-left: 8px; }
  .wrap { padding: 12px 16px; }
  .form-card { background: #fff; border-radius: 8px; padding: 16px; max-width: 100%; }
  .tip { color: #909399; font-size: 11px; line-height: 1.5; }
  .mono { font-family: "SF Mono",Consolas,monospace; font-size: 11px; }

  @media (max-width: 480px) {
    .topbar { padding: 10px 12px; }
    .topbar h1 { font-size: 15px; }
    .wrap { padding: 8px 12px; }
    .form-card { padding: 12px; }
    .el-form-item { margin-bottom: 16px; }
    .el-input__inner { padding: 8px 10px; }
    .el-dialog { width: 92% !important; margin: 0 4% !important; }
    .el-dialog__body { padding: 16px !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1 style="display:inline-block">{{ isEdit ? '编辑 API' : '新增 API' }}</h1>
      <span class="sub">旧识桥 api 管理后台</span>
    </div>
    <div>
      <el-button size="small" :icon="'SwitchButton'" @click="onLogout">退出登录</el-button>
      <el-button size="small" :icon="'Back'" @click="goBack">返回列表</el-button>
    </div>
  </div>

  <div class="wrap">
    <div class="form-card">
      <el-form :model="form" :rules="rules" ref="formRef" label-width="110px" v-loading="loading">

        <el-form-item label="Path" prop="path">
          <el-input v-model="form.path" placeholder="唯一标识，字母数字下划线中划线，如 greeting" maxlength="64"></el-input>
          <div class="tip">对外地址：<span class="mono">{{ callPath }}</span></div>
        </el-form-item>

        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" @input="onNameInput" placeholder="API 名称，用于后台展示" maxlength="100"></el-input>
        </el-form-item>

        <el-form-item label="类型" prop="type">
          <el-radio-group v-model="form.type">
            <el-radio value="random_text">random_text（随机一条素材）</el-radio>
            <el-radio value="template">template（模板变量替换）</el-radio>
          </el-radio-group>
          <div class="tip" v-if="form.type==='random_text'">文字素材请在「素材」页管理中新增；调用时随机返回其中一条。</div>
          <div class="tip" v-else>模板内容支持 {{参数名}} 变量替换；调用方传参后自动替换（未传替换为空）。</div>
        </el-form-item>

        <el-form-item label="模板内容" prop="content" v-if="form.type==='template'">
          <el-input v-model="form.content" @input="onContentInput" type="textarea" :rows="7" placeholder="如：你好，{{ name }}！今天是 {{ date }}。" maxlength="10000" show-word-limit></el-input>
          <div class="tip">使用 <span class="mono">{{参数名}}</span> 定义占位变量，调用方传对应参数即可替换。</div>
        </el-form-item>

        <el-form-item label="启用" prop="enabled">
          <el-switch v-model="form.enabled" :active-value="1" :inactive-value="0" active-text="启用" inactive-text="禁用"></el-switch>
        </el-form-item>

        <el-form-item>
          <el-button type="primary" :icon="'Check'" :loading="saving" @click="onSave">保存</el-button>
          <el-button :icon="'Back'" @click="goBack">取消</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, computed } = Vue;

// 全局注册 Element Plus 图标组件，使 :icon="'Back'" 这类字符串能解析为组件
const app = createApp({
  setup() {
    const JSQ = window.JSQ;
    const formRef = ref(null);
    const isEdit = ref(false);
    const loading = ref(false);
    const saving = ref(false);
    const editId = ref(0);

    const form = reactive({
      path: '',
      name: '',
      type: 'random_text',
      content: '',
      enabled: 1,
    });

    const rules = {
      path: [
        { required: true, message: '请输入 Path', trigger: 'blur' },
        { pattern: /^[a-zA-Z0-9_-]{1,64}$/, message: '仅字母数字下划线中划线，1-64 位', trigger: 'blur' },
      ],
      name: [
        { required: true, message: '请输入名称', trigger: 'blur' },
        { max: 100, message: '最多 100 字', trigger: 'blur' },
      ],
      type: [{ required: true, message: '请选择类型', trigger: 'change' }],
      content: [{ max: 10000, message: '最多 10000 字', trigger: 'blur' }],
    };

    // 对外调用地址（复制用），与后端 runtime 路由一致；接口无需密钥
    const callPath = computed(() => {
      const p = form.path ? form.path : '[path]';
      return JSQ.buildApiUrl(p);
    });

    function limitCodePoints(value, max) {
      return Array.from(String(value || '')).slice(0, max).join('');
    }

    function onNameInput(value) {
      form.name = limitCodePoints(value, 100);
    }

    function onContentInput(value) {
      form.content = limitCodePoints(value, 10000);
    }

    function goBack() { location.href = 'index.html'; }

    function onLogout() {
      JSQ.logout();
    }

    async function loadDetail() {
      const q = new URLSearchParams(location.search);
      const id = parseInt(q.get('id') || '0', 10);
      if (!id || id <= 0) return;
      isEdit.value = true;
      editId.value = id;
      loading.value = true;
      try {
        const row = await JSQ.apiRequest('admin/api/get', { id: id }, 'GET');
        form.path = row.path || '';
        form.name = row.name || '';
        form.type = row.type || 'random_text';
        form.content = row.content || '';
        form.enabled = row.enabled === 1 ? 1 : 0;
      } catch (e) {
        // 拦截器已提示
      } finally {
        loading.value = false;
      }
    }

    async function onSave() {
      try {
        await formRef.value.validate();
      } catch (e) { return; }
      // 模板类型 content 必填
      if (form.type === 'template' && !form.content.trim()) {
        ElMessage.warning('模板内容不能为空');
        return;
      }
      saving.value = true;
      try {
        const payload = {
          path: form.path,
          name: form.name,
          type: form.type,
          content: form.type === 'template' ? form.content : '',
          enabled: form.enabled,
        };
        if (isEdit.value) payload.id = editId.value;
        await JSQ.saveApi(payload);
        ElMessage.success('保存成功');
        goBack();
      } catch (e) {
        // 拦截器已提示
      } finally {
        saving.value = false;
      }
    }

    onMounted(async () => {
      const ok = await JSQ.ensureLogin();
      if (!ok) return;
      loadDetail();
    });

    return { JSQ, form, formRef, rules, isEdit, loading, saving, callPath, onSave, goBack, onNameInput, onContentInput, onLogout };
  },
}).use(ElementPlus);

// 注册图标组件
if (window.ElementPlusIconsVue) {
  for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
    app.component(name, comp);
  }
}

app.mount('#app');
</script>
</body>
</html>
