<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旧识桥 api · 编辑接口</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.6/dist/index.css">
<link rel="stylesheet" href="css/theme.css">
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.6/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
<script src="js/app.js"></script>
<style>
  .form-card { background: #fff; border: 1px solid var(--el-border-color); border-radius: 8px; padding: 24px; max-width: 720px; }
  .call-path { background: #F7F7F5; border: 1px solid var(--el-border-color); border-radius: 6px; padding: 8px 10px; font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--el-text-color-regular); word-break: break-all; margin-top: 6px; }
  @media (max-width: 480px) {
    .form-card { padding: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1>{{ isEdit ? '编辑接口' : '新增接口' }}</h1>
      <span class="sub">接口配置</span>
    </div>
    <div class="actions">
      <el-button size="small" @click="onLogout">退出登录</el-button>
      <el-button size="small" @click="goBack">返回列表</el-button>
    </div>
  </div>

  <div class="wrap">
    <div class="form-card">
      <el-form :model="form" :rules="rules" ref="formRef" label-position="top" v-loading="loading">

        <el-form-item label="Path" prop="path">
          <el-input v-model="form.path" placeholder="唯一标识，如 greeting" maxlength="64"></el-input>
          <div class="call-path">{{ callPath }}</div>
        </el-form-item>

        <el-form-item label="名称" prop="name">
          <el-input v-model="form.name" @input="onNameInput" placeholder="接口名称" maxlength="100"></el-input>
        </el-form-item>

        <el-form-item label="类型" prop="type">
          <el-radio-group v-model="form.type">
            <el-radio value="random_text">随机素材</el-radio>
            <el-radio value="template">模板变量</el-radio>
          </el-radio-group>
          <div class="tip" v-if="form.type==='random_text'">每次调用随机返回一条素材。</div>
          <div class="tip" v-else>支持 {{参数名}} 变量替换，未传参替换为空。</div>
        </el-form-item>

        <el-form-item label="模板内容" prop="content" v-if="form.type==='template'">
          <el-input v-model="form.content" @input="onContentInput" type="textarea" :rows="7"
            placeholder="如：你好，{{ name }}！" maxlength="10000" show-word-limit
            style="font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace"></el-input>
        </el-form-item>

        <el-form-item label="状态">
          <el-switch v-model="form.enabled" :active-value="1" :inactive-value="0" active-text="启用" inactive-text="禁用"></el-switch>
        </el-form-item>

        <el-form-item>
          <el-button type="primary" :loading="saving" @click="onSave">保存</el-button>
          <el-button @click="goBack">取消</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, onMounted, computed } = Vue;

const app = createApp({
  setup() {
    const JSQ = window.JSQ;
    const formRef = ref(null);
    const isEdit = ref(false);
    const loading = ref(false);
    const saving = ref(false);
    const editId = ref(0);

    const form = reactive({
      path: '',
      name: '',
      type: 'random_text',
      content: '',
      enabled: 1,
    });

    const rules = {
      path: [
        { required: true, message: '请输入 Path', trigger: 'blur' },
        { pattern: /^[a-zA-Z0-9_-]{1,64}$/, message: '仅字母数字下划线中划线，1-64 位', trigger: 'blur' },
      ],
      name: [
        { required: true, message: '请输入名称', trigger: 'blur' },
        { max: 100, message: '最多 100 字', trigger: 'blur' },
      ],
      type: [{ required: true, message: '请选择类型', trigger: 'change' }],
      content: [{ max: 10000, message: '最多 10000 字', trigger: 'blur' }],
    };

    const callPath = computed(() => {
      const p = form.path ? form.path : '[path]';
      return JSQ.buildApiUrl(p);
    });

    function limitCodePoints(value, max) {
      return Array.from(String(value || '')).slice(0, max).join('');
    }
    function onNameInput(value) { form.name = limitCodePoints(value, 100); }
    function onContentInput(value) { form.content = limitCodePoints(value, 10000); }

    function goBack() { location.href = 'index.html'; }
    function onLogout() { JSQ.logout(); }

    async function loadDetail() {
      const q = new URLSearchParams(location.search);
      const id = parseInt(q.get('id') || '0', 10);
      if (!id || id <= 0) return;
      isEdit.value = true;
      editId.value = id;
      loading.value = true;
      try {
        const row = await JSQ.apiRequest('admin/api/get', { id: id }, 'GET');
        form.path = row.path || '';
        form.name = row.name || '';
        form.type = row.type || 'random_text';
        form.content = row.content || '';
        form.enabled = row.enabled === 1 ? 1 : 0;
      } catch (e) {
      } finally {
        loading.value = false;
      }
    }

    async function onSave() {
      try {
        await formRef.value.validate();
      } catch (e) { return; }
      if (form.type === 'template' && !form.content.trim()) {
        ElMessage.warning('模板内容不能为空');
        return;
      }
      saving.value = true;
      try {
        const payload = {
          path: form.path,
          name: form.name,
          type: form.type,
          content: form.type === 'template' ? form.content : '',
          enabled: form.enabled,
        };
        if (isEdit.value) payload.id = editId.value;
        await JSQ.saveApi(payload);
        ElMessage.success('已保存');
        goBack();
      } catch (e) {
      } finally {
        saving.value = false;
      }
    }

    onMounted(async () => {
      const ok = await JSQ.ensureLogin();
      if (!ok) return;
      loadDetail();
    });

    return { JSQ, form, formRef, rules, isEdit, loading, saving, callPath, onSave, goBack, onNameInput, onContentInput, onLogout };
  },
}).use(ElementPlus);

if (window.ElementPlusIconsVue) {
  for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
    app.component(name, comp);
  }
}

app.mount('#app');
</script>
</body>
</html>
